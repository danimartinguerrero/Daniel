name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  # Once a day, so /cine follows Daniel's Letterboxd: the build reads his RSS feed before it compiles.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
concurrency: { group: pages, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with: { node-version: 24 }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
